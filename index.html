<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrative GCLU - by ALLLLL</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/iHky2fT.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center py-10 px-4">

    <!-- Header Website dengan Logo -->
    <header class="text-center mb-6 flex flex-col items-center">
        <img src="https://i.imgur.com/iHky2fT.png" alt="GCLU Logo" class="w-16 h-16 mb-2 drop-shadow-lg">
        <h1 class="text-3xl font-bold tracking-wider text-blue-400">Administrative GCLU - by ALLLLL</h1>
        <p class="text-slate-400 text-sm mt-1">Gun Control and Licensing Unit - Multi-License BBCode Generator</p>
    </header>

    <main class="w-full max-w-4xl bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        
        <!-- Navigasi Kategori Utama (Jenis Lisensi) -->
        <div class="mb-6 border-b border-slate-700 pb-4">
            <h2 class="text-lg font-semibold text-blue-300 mb-3">Pilih Kategori Lisensi:</h2>
            <div class="flex flex-wrap gap-2">
                <button onclick="switchCategory('cgc')" class="cat-btn px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-medium transition active-cat" id="cat-cgc">Certificate of Good Conduct (CGC)</button>
                <button onclick="switchCategory('ll')" class="cat-btn px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition" id="cat-ll">Lumberjack License (LL)</button>
                <button onclick="switchCategory('truck')" class="cat-btn px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition" id="cat-truck">Trucking License (LT/HT)</button>
            </div>
        </div>

        <!-- Sub-Navigasi Aksi (Pending, Denied, Accepted, dll) -->
        <div class="mb-6 bg-slate-900/60 p-3 rounded-lg border border-slate-700/60 flex flex-wrap gap-2" id="sub-tabs-container">
            <!-- Dinamis diisi JS tergantung kategori -->
        </div>

        <!-- AREA FORMULIR & OUTPUT -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- KOLOM INPUT FORM -->
            <div class="space-y-4">
                <div class="flex items-center justify-between border-b border-slate-700 pb-2">
                    <h3 class="text-md font-semibold text-slate-300" id="form-title-label">Formulir Input Data</h3>
                    <img src="https://i.imgur.com/iHky2fT.png" alt="mini-logo" class="w-6 h-6 opacity-80">
                </div>

                <!-- ==================== CGC FORMS ==================== -->
                <!-- CGC Pending -->
                <div id="form-cgc-pending" class="license-form space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Nama Belakang Costumer (Lastname)</label>
                        <input type="text" id="cgc_p_lastname" oninput="generateCode()" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="Smith">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Nama Lengkap Costumer (Topic Title)</label>
                        <input type="text" id="cgc_p_fullname" oninput="generateCode()" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="John Smith">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-xs font-medium text-slate-400">Preset Alasan Khusus CGC (Pending):</label>
                        </div>
                        <select id="cgc_p_preset" onchange="applyCgcPendingPreset()" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm mb-2 text-blue-300 focus:outline-none focus:border-blue-500">
                            <option value="">-- Pilih Preset Alasan CGC --</option>
                            <option value="nat">Nationality (Ganti ke American)</option>
                            <option value="addr">Current Address (Sesuai ingame)</option>
                            <option value="pob">Place of Birth (Kota & Negara)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Alasan / Kesalahan (Ketik Indo &rarr; Klik Translate)</label>
                        <div id="cgc_p_reasons_container" class="space-y-2 mb-2">
                            <div class="flex gap-2 items-center">
                                <input type="text" class="cgc-p-reason-input w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm" oninput="generateCode()" placeholder="Ketik alasan...">
                                <button type="button" onclick="translateReasonInput(this, 'cgc-p')" class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1.5 rounded whitespace-nowrap">Translate</button>
                            </div>
                        </div>
                        <button type="button" onclick="addReasonInput('cgc_p_reasons_container', 'cgc-p-reason-input', 'cgc-p')" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition">+ Tambah Alasan</button>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Pangkat GCLU</label>
                        <select id="cgc_p_rank" onchange="checkCustomRank('cgc_p_rank', 'cgc_p_custom_rank_wrapper')" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm">
                            <option value="LU Trainee">LU Trainee</option>
                            <option value="LU Staff">LU Staff</option>
                            <option value="LU Leader">LU Leader</option>
                            <option value="GCU Trainee">GCU Trainee</option>
                            <option value="GCU Staff">GCU Staff</option>
                            <option value="GCU Leader">GCU Leader</option>
                            <option value="GCLU Vice Director">GCLU Vice Director</option>
                            <option value="GCLU Director">GCLU Director</option>
                            <option value="custom">Custom Pangkat...</option>
                        </select>
                    </div>
                    <div id="cgc_p_custom_rank_wrapper" class="hidden">
                        <input type="text" id="cgc_p_custom_rank" oninput="generateCode()" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm" placeholder="Ketik pangkat custom...">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Nama Officer</label>
                        <input type="text" id="cgc_p_officer" oninput="generateCode()" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm" placeholder="Nama Anda">
                    </div>
                    <!-- Signature Section -->
                    <div class="space-y-2 border-t border-slate-700 pt-3">
                        <label class="block text-xs font-medium text-slate-400">Signature (Opsional)</label>
                        <select id="cgc_p_sig_select" onchange="handleSigSelect('cgc_p')" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm">
                            <option value="">-- Tanpa Signature / Pilih Preset --</option>
                            <option value="https://imgur.com/ehQ16je.png">Matias Valentino</option>
                            <option value="https://www.upload.ee/image/19383869/Synpzano_1.gif">Synyster Provenzano</option>
                            <option value="https://i.postimg.cc/hP46n3z9/signature-54-B91-A1-AE7-E1-F9-B1650-F57-E4-D9-CA47-F9.png">Vyacheslav Ignatyev</option>
                            <option value="https://imgur.com/ViYn0hy.png">Kavion Weaver</option>
                            <option value="custom">Ketik / Masukkan Link Sendiri...</option>
                        </select>
                        <div id="cgc_p_custom_sig_wrapper" class="hidden">
                            <input type="text" id="cgc_p_sig" oninput="generateCode()" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm" placeholder="https://i.imgur.com/xxxxx.png">

                    </div>
                    <div>

                    </div>
                    <!-- Signature -->

        async function translateReasonInput(btnOrInput, prefix) {
            let input;
            if (btnOrInput.tagName === 'INPUT') {
                input = btnOrInput;
            } else {
                input = btnOrInput.previousElementSibling;
            }
            
            let text = input.value.trim();
            if (!text) return;

            let originalText = btnOrInput.innerText || "Translate";
            if (btnOrInput.tagName === 'BUTTON') {
                btnOrInput.innerText = "...";
            } else {
                let btn = input.nextElementSibling;
                if(btn) btn.innerText = "...";
            }

            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=id|en`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data && data.responseData && data.responseData.translatedText) {
                    let translated = data.responseData.translatedText;
                    translated = translated.charAt(0).toUpperCase() + translated.slice(1);
                    input.value = translated;
                    generateCode();
                }
            } catch (error) {
                console.error("Translation error:", error);
                alert("Gagal menerjemahkan otomatis. Pastikan terhubung ke internet.");
            } finally {
                if (btnOrInput.tagName === 'BUTTON') {
                    btnOrInput.innerText = originalText;
                } else {
                    let btn = input.nextElementSibling;
                    if(btn) btn.innerText = originalText;
                }
            }
        }

        function formatDateNumeric(dateString) {
            if (!dateString) return 'DD/MM/YYYY';
            const date = new Date(dateString);
            if (isNaN(date)) return 'DD/MM/YYYY';
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function formatDateShortMonth(dateString) {
            if (!dateString) return '30/AUGUST/2026';
            const date = new Date(dateString);
            if (isNaN(date)) return '30/AUGUST/2026';
            const day = String(date.getDate()).padStart(2, '0');
            const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
            const monthStr = months[date.getMonth()];
            const year = date.getFullYear();
            return `${day}/${monthStr}/${year}`;
        }

        function applyValidityPreset(typePrefix) {
            const presetVal = document.getElementById(typePrefix + '_val_preset').value;
            if (presetVal === 'custom') return;
            const days = parseInt(presetVal);
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + days);
            const yyyy = targetDate.getFullYear();
            const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
            const dd = String(targetDate.getDate()).padStart(2, '0');
            document.getElementById(typePrefix + '_val_date').value = `${yyyy}-${mm}-${dd}`;
            generateCode();
        }
