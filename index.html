                    <textarea id="output-bbcode" readonly rows="15" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-xs font-mono text-slate-300 focus:outline-none select-all resize-none flex-grow"></textarea>
                </div>
            </div>

        </div>

    </main>

    <footer class="mt-8 text-xs text-slate-500">
        Administrative GCLU &copy; 2026 - Created by ALLLLL
    </footer>

    <script>
        let currentTab = 'pending';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.form-section').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('bg-blue-600', 'active-tab');
                el.classList.add('bg-slate-700');
            });

            document.getElementById('form-' + tab).classList.remove('hidden');
            const activeBtn = document.getElementById('btn-' + tab);
            activeBtn.classList.remove('bg-slate-700');
            activeBtn.classList.add('bg-blue-600', 'active-tab');

            generateCode();
        }

        function checkCustomRank(selectId, wrapperId) {
            const select = document.getElementById(selectId);
            const wrapper = document.getElementById(wrapperId);
            if (select.value === 'custom') {
                wrapper.classList.remove('hidden');
            } else {
                wrapper.classList.add('hidden');
            }
            generateCode();
        }

        function getRankValue(selectId, customInputId) {
            const select = document.getElementById(selectId);
            if (select.value === 'custom') {
                return document.getElementById(customInputId).value || 'GCLU Rank';
            }
            return select.value;
        }

        function addReasonInput(containerId, inputClass) {
            const container = document.getElementById(containerId);
            if (container.children.length >= 5) return; 
            const div = document.createElement('div');
            div.className = "flex gap-2";
            div.innerHTML = `<input type="text" class="${inputClass} w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm" oninput="autoTranslateInput(this); generateCode();" placeholder="Alasan tambahan...">
                             <button type="button" onclick="this.parentElement.remove(); generateCode();" class="text-xs bg-red-800 hover:bg-red-700 px-2 rounded text-white">X</button>`;
            container.appendChild(div);
        }

        // Kamus penerjemah otomatis real-time Indo ke Inggris Formal
        const dictionary = {
            "foto lisensi tidak jelas": "The license photo provided is unclear and blurry",
            "foto tidak jelas": "The photograph provided is unclear",
            "kurang lengkap": "The application details are incomplete",
            "bukti kurang": "Insufficient evidence or documentation provided",
            "salah format": "The application format is incorrect",
            "belum memenuhi syarat": "Does not meet the requirements for licensing",
            "catatan kriminal": "The applicant has an active criminal record",
            "memiliki catatan kriminal": "The applicant has previous criminal charges",
            "alasan kesehatan": "Medical or psychological clearance issues",
            "palsu": "The submitted document appears to be forged or invalid",
            "tidak valid": "The provided information is invalid",
            "usia belum cukup": "The applicant does not meet the minimum age requirement",
            "izin ditolak": "The licensing application has been denied due to background check failure"
        };

        function translateToFormalEnglish(text) {
            let lower = text.toLowerCase().trim();
            if (dictionary[lower]) {
                return dictionary[lower];
            }
            if (lower.includes("foto") || lower.includes("gambar")) {
                return "The provided photograph or image attachment is invalid or unclear.";
            }
            if (lower.includes("pajak") || lower.includes("bayar")) {
                return "Failure to complete administrative fees or tax requirements.";
            }
            if (lower.includes("salah") || lower.includes("keliru")) {
                return "Contains incorrect information that requires immediate revision.";
            }
            return text;
        }

        function autoTranslateInput(input) {
            let original = input.value;
            let translated = translateToFormalEnglish(original);
            if (translated !== original) {
                input.value = translated;
            }
        }

        function addChargeInput() {
            const container = document.getElementById('c_charges_container');
            if (container.children.length >= 3) return; 
            const div = document.createElement('div');
            div.className = "p-2 bg-slate-900 border border-slate-700 rounded space-y-2 relative";
            div.innerHTML = `<input type="text" class="c-charge-text w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs" oninput="generateCode()" placeholder="Nama Pasal / Deskripsi">
                             <input type="date" class="c-charge-date w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-300" onchange="generateCode()">
                             <button type="button" onclick="this.parentElement.remove(); generateCode();" class="absolute top-1 right-2 text-xs bg-red-800 text-white px-1.5 rounded">X</button>`;
            container.appendChild(div);
        }

        function formatDate(dateString) {
            if (!dateString) return 'DD/MMM/YYYY';
            const date = new Date(dateString);
            if (isNaN(date)) return 'DD/MMM/YYYY';
            const day = String(date.getDate()).padStart(2, '0');
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const month = months[date.getMonth()];
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function getSignatureBlock(sigUrl, rank, officer) {
            let sigClean = sigUrl ? sigUrl.trim() : "";
            if (sigClean !== "") {
                return `[right]Sincerely, 
[img]${sigClean}[/img]
[b]${rank}[/b], [i]${officer}[/i][/right]`;
            } else {
                return `[right]Sincerely, 
[b]${rank}[/b], [i]${officer}[/i][/right]`;
            }
        }

        function generateCode() {
            let title = "";
            let bbcode = "";

            if (currentTab === 'pending') {
                const lastname = document.getElementById('p_lastname').value || 'Lastname';
                const fullname = document.getElementById('p_fullname').value || 'Nama Costumer';
                const rank = getRankValue('p_rank', 'p_custom_rank');
                const officer = document.getElementById('p_officer').value || 'Name';
                const sigUrl = document.getElementById('p_sig').value;

                title = `[CGC] ${fullname} [PENDING]`;

                let reasonsHtml = "";
                document.querySelectorAll('.p-reason-input').forEach(input => {
                    if (input.value.trim() !== "") {
                        reasonsHtml += `[*] ${input.value}\n`;
                    }
                });
                if (!reasonsHtml) reasonsHtml = `[*] KESALAHAN YANG HARUS DIA KOREKSI\n`;

                const signBlock = getSignatureBlock(sigUrl, rank, officer);

                bbcode = `[divbox=#F1F1F1][center]
[img]https://i.imgur.com/iHky2fT.png[/img]
[b][size=125]Administrative Services Bureau - Gun Control and Licensing Unit[/size][/b]
[b][size=125]License Application Response[/size][/b][/center]
[hr][/hr]
[divbox=#20354C][color=white][center]Certificate of Good Conduct[/center][/color][/divbox]

Dear Mr./Mrs. ${lastname},

We've reviewed your application and your record, and after a long deliberation, we'd like to inform you that we've decided to [color=orange][b]PENDING[/b][/color] your application because of the following reason:

[b]Reason(s):[/b]
[list]
${reasonsHtml.trim()}
[/list]

[b]Note(s):[/b]
[list][*]You have 7 days to make things right.[/list]

${signBlock}[/divbox]`;

            } else if (currentTab === 'denied') {
                const lastname = document.getElementById('d_lastname').value || 'Lastname';
                const fullname = document.getElementById('d_fullname').value || 'Nama Costumer';
                const note = document.getElementById('d_note').value || '(KASIH TAU DIA BISA BUAT BARU ATAU TIDAK)';
                const rank = getRankValue('d_rank', 'd_custom_rank');
                const officer = document.getElementById('d_officer').value || 'Name';
                const sigUrl = document.getElementById('d_sig').value;

                title = `[CGC] ${fullname} [DENIED]`;

                let reasonsHtml = "";
                document.querySelectorAll('.d-reason-input').forEach(input => {
                    if (input.value.trim() !== "") {
                        reasonsHtml += `[*] ${input.value}\n`;
                    }
                });
                if (!reasonsHtml) reasonsHtml = `[*] ALASAN DIDENY\n`;

                const signBlock = getSignatureBlock(sigUrl, rank, officer);

                bbcode = `[divbox=#F1F1F1][center]
[img]https://i.imgur.com/iHky2fT.png[/img]
[b][size=125]Administrative Services Bureau - Gun Control and Licensing Unit[/size][/b]
[b][size=125]License Application Response[/size][/b][/center]
[hr][/hr]
[divbox=#20354C][color=white][center]Certificate of Good Conduct[/center][/color][/divbox]

Dear Mr./Mrs. ${lastname},

We've reviewed your application and your record, and after a long deliberation, we'd like to inform you that your application has been [color=red][b]DENIED[/b][/color] because of the following reason:

[b]Reason(s):[/b]
[list]
${reasonsHtml.trim()}
[/list]

[b]Note(s):[/b]
[list][*] ${note}[/list]

${signBlock}[/divbox]`;

            } else if (currentTab === 'accepted') {
                const lastname = document.getElementById('a_lastname').value || 'Lastname';
                const fullname = document.getElementById('a_fullname').value || 'Nama Costumer';
                const rank = getRankValue('a_rank', 'a_custom_rank');
                const officer = document.getElementById('a_officer').value || 'Name';
                const sigUrl = document.getElementById('a_sig').value;

                title = `[CGC] ${fullname} [ADMINISTRATION]`;

                const signBlock = getSignatureBlock(sigUrl, rank, officer);

                bbcode = `[divbox=#F1F1F1][center]
[img]https://i.imgur.com/iHky2fT.png[/img]
[b][size=125]Administrative Services Bureau - Gun Control and Licensing Unit[/size][/b]
[b][size=125]License Application Response[/size][/b][/center]
[hr][/hr]
[divbox=#20354C][color=white][center]Certificate of Good Conduct[/center][/color][/divbox]

Dear Mr./Mrs. ${lastname},

We've reviewed your application and your record, and after a long deliberation, we'd like to inform you that your application has been [color=green][b]ACCEPTED[/b][/color]. However, this is not the end, you can finish your administration by calling our hotline 5-5-5 (do not spam!).

[b]Note(s):[/b]
[list][*]You have 7 days to finish your administration.[/list]

${signBlock}[/divbox]`;

            } else if (currentTab === 'nocrime') {
                const name = document.getElementById('nc_name').value || 'Full Name';
                const reg = document.getElementById('nc_reg').value || '00000';
                const gender = document.getElementById('nc_gender').value;
                const pob = document.getElementById('nc_pob').value || 'Place of Birth';
                const dob = formatDate(document.getElementById('nc_dob').value);
                const address = document.getElementById('nc_address').value || 'Address';
                const vfrom = formatDate(document.getElementById('nc_vfrom').value);
                const vto = formatDate(document.getElementById('nc_vto').value);
                const rank = getRankValue('nc_rank', 'nc_custom_rank');
                const officer = document.getElementById('nc_officer').value || 'Name';
                const sigUrl = document.getElementById('nc_sig').value;

                title = `[CGC] ${name} [SA-${reg}]`;

                const signBlock = getSignatureBlock(sigUrl, rank, officer);

                bbcode = `[divbox=#F1F1F1][center]
[img]https://i.imgur.com/iHky2fT.png[/img]
[b][size=125]Administrative Services Bureau - Gun Control and Licensing Unit[/size][/b]
[b][size=125]Certificate of Good Conduct[/size][/b][/center]
[hr][/hr]
[divbox=#20354C][color=white][center]Applicant Information[/center][/color][/divbox]

[list][*][b]Full Name:[/b] ${name}
[*][b]Gender:[/b] ${gender}
[*][b]Place of Birth:[/b] ${pob}
[*][b]Date of Birth:[/b] ${dob}
[*][b]Address:[/b] ${address}[/list]

[divbox=#20354C][color=white][center]Checking Result[/center][/color][/divbox]

Based on the MDC check that has been conducted on the person with the information above, it is declared that the person with the information above is [b][color=#00FF00]clear from any criminal records[/color][/b] during his/her life in the State of San Andreas.

[divbox=#20354C][color=white][center]Certificate Information[/center][/color][/divbox]

[list][*][b]Certificate Number:[/b] SA-${reg}
[*][b]Valid From:[/b] ${vfrom}
[*][b]Valid To:[/b] ${vto}[/list]

${signBlock}[/divbox]`;

            } else if (currentTab === 'crime') {
                const name = document.getElementById('c_name').value || 'Full Name';
                const reg = document.getElementById('c_reg').value || '00000';
                const gender = document.getElementById('c_gender').value;
                const pob = document.getElementById('c_pob').value || 'Place of Birth';
                const dob = formatDate(document.getElementById('c_dob').value);
                const address = document.getElementById('c_address').value || 'Address';
                const vfrom = formatDate(document.getElementById('c_vfrom').value);
                const vto = formatDate(document.getElementById('c_vto').value);
                const rank = getRankValue('c_rank', 'c_custom_rank');
                const officer = document.getElementById('c_officer').value || 'Name';
                const sigUrl = document.getElementById('c_sig').value;

                title = `[CGC] ${name} [SA-${reg}]`;

                let chargesHtml = "";
                document.querySelectorAll('#c_charges_container > div').forEach(div => {
                    const txt = div.querySelector('.c-charge-text').value || 'CHARGES';
                    const dt = formatDate(div.querySelector('.c-charge-date').value);
                    chargesHtml += `[*] ${txt} - [b]${dt}[/b]\n`;
                });
                if (!chargesHtml.trim()) {
                    chargesHtml = `[*] CHARGES - [b]DD/MMM/YYYY[/b]\n`;
                }

                const signBlock = getSignatureBlock(sigUrl, rank, officer);

                bbcode = `[divbox=#F1F1F1][center]
[img]https://i.imgur.com/iHky2fT.png[/img]
[b][size=125]Administrative Services Bureau - Gun Control and Licensing Unit[/size][/b]
[b][size=125]Certificate of Good Conduct[/size][/b][/center]
[hr][/hr]
[divbox=#20354C][color=white][center]Applicant Information[/center][/color][/divbox]

[list][*][b]Full Name:[/b] ${name}
[*][b]Gender:[/b] ${gender}
[*][b]Place of Birth:[/b] ${pob}
[*][b]Date of Birth:[/b] ${dob}
[*][b]Address:[/b] ${address}[/list]

[divbox=#20354C][color=white][center]Checking Result[/center][/color][/divbox]

Based on the MDC check that has been conducted on the person with the information above, it is declared that the person with the information above [b][color=#BFFF00]had been charged for criminal case(s)[/color][/b] before. Latest charge(s):

[list]
${chargesHtml.trim()}
[/list]

[divbox=#20354C][color=white][center]Certificate Information[/center][/color][/divbox]

[list][*][b]Certificate Number:[/b] SA-${reg}
[*][b]Valid From:[/b] ${vfrom}
[*][b]Valid To:[/b] ${vto}[/list]

${signBlock}[/divbox]`;
            }

            document.getElementById('output-title').value = title;
            document.getElementById('output-bbcode').value = bbcode;
        }

        function copyText(elementId, btnId) {
            const copyText = document.getElementById(elementId);
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);

            const btn = document.getElementById(btnId);
            const originalText = btn.innerText;
            btn.innerText = "Copied!";
            btn.classList.add('bg-green-600', 'text-white');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('bg-green-600', 'text-white');
            }, 1500);
        }

        // Jalankan saat pertama kali dimuat
        generateCode();
    </script>
</body>
</html>
